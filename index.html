<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP SaaS - Control de Negocios</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .title { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 8px; color: #38bdf8; }
    .subtitle { font-size: 14px; text-align: center; color: #94a3b8; margin-bottom: 24px; }
    .field-group { margin-bottom: 14px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #cbd5e1; margin-bottom: 5px; text-transform: uppercase; }
    input, select {
      width: 100%;
      padding: 10px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus { border-color: #38bdf8; }
    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 8px;
      font-size: 14px;
    }
    .btn-primary { background-color: #0284c7; color: white; }
    .btn-secondary { background-color: #334155; color: white; }
    .btn-success { background-color: #10b981; color: white; }
    .btn-danger { background-color: #ef4444; color: white; }
    .btn:hover { opacity: 0.9; }
    
    .dashboard { width: 100%; max-width: 1100px; display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 24px; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #94a3b8; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background-color: #0284c7; color: white; border-color: #38bdf8; }
    
    .grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .panel { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background-color: #0f172a; color: #94a3b8; padding: 10px; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #334155; }
    td { padding: 12px 10px; border-bottom: 1px solid #334155; color: #e2e8f0; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background-color: #334155; color: #38bdf8; }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="login-view" class="auth-card">
    <h1 class="title">ERP SaaS</h1>
    <p class="subtitle">Ingresa a tu cuenta o registra tu empresa</p>
    <div class="field-group">
      <label>Correo Electrónico</label>
      <input type="email" id="email" placeholder="usuario@empresa.com" />
    </div>
    <div class="field-group">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <button id="btn-login" class="btn btn-primary">Iniciar Sesión</button>
    <button id="btn-signup" class="btn btn-secondary">Registrarse</button>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view" class="dashboard">
    <header class="header">
      <div>
        <h1 style="font-size: 20px; font-weight: bold;">Panel ERP SaaS</h1>
        <p id="user-email" style="font-size: 12px; color: #94a3b8;"></p>
      </div>
      <button id="btn-logout" class="btn btn-danger" style="width: auto; padding: 8px 16px;">Cerrar Sesión</button>
    </header>

    <div class="nav-tabs">
      <button id="tab-inventory-btn" class="tab-btn active" onclick="switchTab('inventory')">📦 Inventario</button>
      <button id="tab-sales-btn" class="tab-btn" onclick="switchTab('sales')">🛒 Punto de Venta / Ventas</button>
    </div>

    <!-- SECCIÓN INVENTARIO -->
    <div id="tab-inventory" class="grid">
      <div class="panel">
        <h2 style="font-size: 16px; margin-bottom: 16px;">Nuevo Producto</h2>
        <div class="field-group">
          <label>Nombre del Producto</label>
          <input type="text" id="prod-name" placeholder="Ej. Impresora POS" />
        </div>
        <div class="field-group">
          <label>Código / SKU</label>
          <input type="text" id="prod-sku" placeholder="Ej. IMP-001" />
        </div>
        <div class="field-group">
          <label>Categoría</label>
          <input type="text" id="prod-cat" placeholder="Ej. Hardware, Servicios" />
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="field-group">
            <label>Precio ($)</label>
            <input type="number" id="prod-price" placeholder="150.00" />
          </div>
          <div class="field-group">
            <label>Stock Inicial</label>
            <input type="number" id="prod-stock" placeholder="10" />
          </div>
        </div>
        <button id="btn-add-prod" class="btn btn-success">Guardar en Inventario</button>
      </div>

      <div class="panel">
        <h2 style="font-size: 16px; margin-bottom: 16px;">Inventario de la Empresa</h2>
        <div id="products-list" style="overflow-x: auto;"></div>
      </div>
    </div>

    <!-- SECCIÓN VENTAS -->
    <div id="tab-sales" class="grid" style="display: none;">
      <div class="panel">
        <h2 style="font-size: 16px; margin-bottom: 16px;">Registrar Venta</h2>
        <div class="field-group">
          <label>Seleccionar Producto</label>
          <select id="sale-prod-select"></select>
        </div>
        <div class="field-group">
          <label>Cantidad</label>
          <input type="number" id="sale-qty" value="1" min="1" />
        </div>
        <button id="btn-register-sale" class="btn btn-primary">Completar Venta</button>
      </div>

      <div class="panel">
        <h2 style="font-size: 16px; margin-bottom: 16px;">Historial de Ventas</h2>
        <div id="sales-list" style="overflow-x: auto;"></div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ REEMPLAZA CON TUS CLAVES DE SUPABASE
    const SUPABASE_URL = "https://fnxjiottyuzxfpaunmfk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_mI3N805ARS6VqUHuS1rc6Q_dXPYV74Y";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentProducts = [];

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) showDashboard(session.user.email);
      else showLogin();
    }

    function showLogin() {
      document.getElementById('login-view').style.display = 'block';
      document.getElementById('dashboard-view').style.display = 'none';
    }

    function showDashboard(email) {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'block';
      document.getElementById('user-email').textContent = "Empresa: " + email;
      loadProducts();
      loadSales();
    }

    function switchTab(tab) {
      document.getElementById('tab-inventory').style.display = tab === 'inventory' ? 'grid' : 'none';
      document.getElementById('tab-sales').style.display = tab === 'sales' ? 'grid' : 'none';
      document.getElementById('tab-inventory-btn').className = 'tab-btn ' + (tab === 'inventory' ? 'active' : '');
      document.getElementById('tab-sales-btn').className = 'tab-btn ' + (tab === 'sales' ? 'active' : '');
    }

    document.getElementById('btn-login').onclick = async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert("Error: " + error.message);
      else showDashboard(data.user.email);
    };

    document.getElementById('btn-signup').onclick = async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) alert("Error: " + error.message);
      else alert("¡Registro exitoso! Haz clic en 'Iniciar Sesión'.");
    };

    document.getElementById('btn-logout').onclick = async () => {
      await supabaseClient.auth.signOut();
      showLogin();
    };

    async function loadProducts() {
      const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
      if (error) return;
      currentProducts = data || [];

      // Renderizar tabla de inventario
      const listEl = document.getElementById('products-list');
      if (currentProducts.length === 0) {
        listEl.innerHTML = '<p style="color: #94a3b8;">No hay productos guardados aún.</p>';
      } else {
        let html = '<table><thead><tr><th>SKU</th><th>Producto</th><th>Categoría</th><th>Stock</th><th>Precio</th></tr></thead><tbody>';
        currentProducts.forEach(p => {
          html += `<tr><td><span class="badge">${p.sku || 'N/A'}</span></td><td><strong>${p.name}</strong></td><td>${p.category || 'General'}</td><td style="color: ${p.stock > 0 ? '#f8fafc' : '#ef4444'}; font-weight: bold;">${p.stock || 0} u.</td><td style="color: #34d399; font-weight: bold;">$${p.price}</td></tr>`;
        });
        listEl.innerHTML = html + '</tbody></table>';
      }

      // Actualizar selector de ventas
      const selectEl = document.getElementById('sale-prod-select');
      selectEl.innerHTML = currentProducts.map(p => `<option value="${p.id}">${p.name} - $${p.price} (Stock: ${p.stock})</option>`).join('');
    }

    document.getElementById('btn-add-prod').onclick = async () => {
      const name = document.getElementById('prod-name').value;
      const sku = document.getElementById('prod-sku').value;
      const category = document.getElementById('prod-cat').value;
      const price = parseFloat(document.getElementById('prod-price').value);
      const stock = parseInt(document.getElementById('prod-stock').value) || 0;

      if (!name || isNaN(price)) return alert("Ingresa al menos el Nombre y un Precio válido.");

      const { error } = await supabaseClient.from('products').insert([{ name, sku, category: category || 'General', price, stock }]);
      if (error) alert("Error: " + error.message);
      else {
        document.getElementById('prod-name').value = '';
        document.getElementById('prod-sku').value = '';
        document.getElementById('prod-cat').value = '';
        document.getElementById('prod-price').value = '';
        document.getElementById('prod-stock').value = '';
        loadProducts();
      }
    };

    // Registrar Venta
    document.getElementById('btn-register-sale').onclick = async () => {
      const prodId = document.getElementById('sale-prod-select').value;
      const qty = parseInt(document.getElementById('sale-qty').value) || 1;
      const product = currentProducts.find(p => p.id == prodId);

      if (!product) return alert("Selecciona un producto.");
      if (product.stock < qty) return alert("Stock insuficiente.");

      const total = product.price * qty;

      // 1. Registrar Venta
      const { error: saleError } = await supabaseClient.from('sales').insert([{
        product_id: product.id,
        product_name: product.name,
        quantity: qty,
        total_price: total
      }]);

      if (saleError) return alert("Error al registrar venta: " + saleError.message);

      // 2. Descontar Stock
      await supabaseClient.from('products').update({ stock: product.stock - qty }).eq('id', product.id);

      loadProducts();
      loadSales();
      alert("¡Venta realizada con éxito!");
    };

    async function loadSales() {
      const { data, error } = await supabaseClient.from('sales').select('*').order('id', { ascending: false });
      const salesEl = document.getElementById('sales-list');
      if (error || !data || data.length === 0) {
        salesEl.innerHTML = '<p style="color: #94a3b8;">No se han registrado ventas aún.</p>';
        return;
      }
      let html = '<table><thead><tr><th>Fecha</th><th>Producto</th><th>Cantidad</th><th>Total</th></tr></thead><tbody>';
      data.forEach(s => {
        const date = new Date(s.created_at).toLocaleDateString();
        html += `<tr><td>${date}</td><td><strong>${s.product_name}</strong></td><td>${s.quantity} u.</td><td style="color: #34d399; font-weight: bold;">$${s.total_price}</td></tr>`;
      });
      salesEl.innerHTML = html + '</tbody></table>';
    }

    checkSession();
  </script>
</body>
</html>
