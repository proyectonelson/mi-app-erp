<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP SaaS - Control de Negocios</title>
  <!-- React & Dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .title { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 8px; color: #38bdf8; }
    .subtitle { font-size: 14px; text-align: center; color: #94a3b8; margin-bottom: 24px; }
    .field-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; }
    input {
      width: 100%;
      padding: 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 8px;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn-primary { background-color: #0284c7; color: white; }
    .btn-secondary { background-color: #334155; color: white; }
    .btn-success { background-color: #10b981; color: white; }
    .btn-danger { background-color: #ef4444; color: white; }
    .btn:hover { opacity: 0.9; }
    
    /* Dashboard styles */
    .dashboard { width: 100%; max-width: 900px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .panel { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    .item-row { display: flex; justify-content: space-between; background-color: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = "PEGA_AQUI_TU_PROJECT_URL";
    const SUPABASE_ANON_KEY = "PEGA_AQUI_TU_ANON_PUBLIC_KEY";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [session, setSession] = React.useState(null);
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const [products, setProducts] = React.useState([]);
      const [newProductName, setNewProductName] = React.useState('');
      const [newProductPrice, setNewProductPrice] = React.useState('');

      React.useEffect(() => {
        supabaseClient.auth.getSession().then(({ data: { session } }) => setSession(session));
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => setSession(session));
        return () => subscription.unsubscribe();
      }, []);

      React.useEffect(() => {
        if (session) fetchProducts();
      }, [session]);

      const fetchProducts = async () => {
        const { data, error } = await supabaseClient.from('products').select('*');
        if (!error && data) setProducts(data);
      };

      const handleAuth = async (isSignUp) => {
        setLoading(true);
        const { error } = isSignUp 
          ? await supabaseClient.auth.signUp({ email, password })
          : await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) alert("Error: " + error.message);
        else if (isSignUp) alert("¡Registro iniciado! Si requieres confirmar correo, revisa tu bandeja.");
        setLoading(false);
      };

      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (!newProductName || !newProductPrice) return;

        const { error } = await supabaseClient.from('products').insert([
          { name: newProductName, price: parseFloat(newProductPrice) }
        ]);

        if (error) alert("Error: " + error.message);
        else {
          setNewProductName('');
          setNewProductPrice('');
          fetchProducts();
        }
      };

      if (!session) {
        return (
          <div className="auth-card">
            <h1 className="title">ERP SaaS</h1>
            <p className="subtitle">Ingresa a tu cuenta o registra tu empresa</p>
            
            <div className="field-group">
              <label>Correo Electrónico</label>
              <input 
                type="email" 
                value={email} 
                onChange={(e) => setEmail(e.target.value)}
                placeholder="usuario@empresa.com"
              />
            </div>
            <div className="field-group">
              <label>Contraseña</label>
              <input 
                type="password" 
                value={password} 
                onChange={(e) => setPassword(e.target.value)}
                placeholder="••••••••"
              />
            </div>
            <button onClick={() => handleAuth(false)} disabled={loading} className="btn btn-primary">
              {loading ? 'Cargando...' : 'Iniciar Sesión'}
            </button>
            <button onClick={() => handleAuth(true)} disabled={loading} className="btn btn-secondary">
              Registrarse
            </button>
          </div>
        );
      }

      return (
        <div className="dashboard">
          <header className="header">
            <div>
              <h1 style={{ fontSize: '20px', fontWeight: 'bold' }}>Panel ERP SaaS</h1>
              <p style={{ fontSize: '12px', color: '#94a3b8' }}>Empresa: {session.user.email}</p>
            </div>
            <button onClick={() => supabaseClient.auth.signOut()} className="btn btn-danger" style={{ width: 'auto', padding: '8px 16px' }}>
              Cerrar Sesión
            </button>
          </header>

          <main className="grid">
            <div className="panel">
              <h2 style={{ fontSize: '16px', marginBottom: '16px' }}>Agregar Producto</h2>
              <form onSubmit={handleAddProduct}>
                <div className="field-group">
                  <label>Nombre del Producto</label>
                  <input 
                    type="text" 
                    value={newProductName} 
                    onChange={(e) => setNewProductName(e.target.value)}
                    placeholder="Ej. Impresora POS"
                  />
                </div>
                <div className="field-group">
                  <label>Precio ($)</label>
                  <input 
                    type="number" 
                    value={newProductPrice} 
                    onChange={(e) => setNewProductPrice(e.target.value)}
                    placeholder="150.00"
                  />
                </div>
                <button type="submit" className="btn btn-success">
                  Guardar en Inventario
                </button>
              </form>
            </div>

            <div className="panel">
              <h2 style={{ fontSize: '16px', marginBottom: '16px' }}>Inventario de la Empresa</h2>
              {products.length === 0 ? (
                <p style={{ color: '#94a3b8', fontSize: '14px' }}>No hay productos guardados aún.</p>
              ) : (
                products.map((p) => (
                  <div key={p.id} className="item-row">
                    <span>{p.name}</span>
                    <strong style={{ color: '#34d399' }}>${p.price}</strong>
                  </div>
                ))
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
